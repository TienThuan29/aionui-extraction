# Builds the docs desktop app on Windows, macOS and Linux; download the files from the run's Artifacts.
# Pushing a v* tag (git tag v0.1.1 && git push origin v0.1.1) also publishes them as a GitHub Release,
# which the README's Download links point to.
name: Pack docs app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run playground:build
      - run: bunx electron-builder --config playground/electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AionUI-Docs-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
