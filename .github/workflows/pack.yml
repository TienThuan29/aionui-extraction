# Builds the docs desktop app on Windows, macOS and Linux; download the files from the run's Artifacts.
name: Pack docs app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run playground:build
      - run: bunx electron-builder --config playground/electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AionUI-Docs-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
